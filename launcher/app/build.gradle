plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ivantrj.glasslauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ivantrj.glasslauncher.os7'
        minSdk 28          // This separate port targets Fire OS 7 / Android 9.
        targetSdk 30
        versionCode 1
        versionName '1.0-os7'
    }

    signingConfigs {
        debug {
            if (project.hasProperty('glassSigningStore')) {
                storeFile file(project.property('glassSigningStore'))
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // This local device port deliberately retains target 30. NewApi remains enforced.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
